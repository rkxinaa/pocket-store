<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo offline con JavaScript puro">
    <meta name="theme-color" content="#db2777">
    <title>PocketStore</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="topbar">
        <h1>PocketStore</h1>
        <span id="status" class="status online">En línea</span>
    </header>

    <main class="layout">

        <aside class="sidebar">
            <h2>Buscar</h2>
            <p class="sidebar-text">Filtra el catálogo por nombre o ciudad.</p>

            <input type="search" id="search" placeholder="Ej. Leanne o Gwenborough">
            <button id="btn-reload" type="button">Actualizar</button>

            <p id="info" class="info"></p>
        </aside>

        <section class="panel">
            <h2>Usuarios</h2>
            <div id="catalog" class="catalog">
                <p class="message">Cargando catálogo...</p>
            </div>
        </section>

    </main>
    <footer class="footer">
      <p>PocketStore · Progressive Web App · Regina Ramos</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
